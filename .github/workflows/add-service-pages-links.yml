name: Koble inn permanente tjenestesider

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/add-service-pages-links.yml'

permissions:
  contents: write

jobs:
  update-service-links:
    runs-on: ubuntu-latest
    steps:
      - name: Hent kildekoden
        uses: actions/checkout@v4

      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Koble inn bryllup og familie-portrett
        run: python .github/scripts/add_service_pages_links.py

      - name: Kontroller resultatet
        shell: bash
        run: |
          test -f bryllupsfotograf-ringsaker.html
          test -f familie-portrettfotograf-ringsaker.html
          grep -q 'bryllupsfotograf-ringsaker.html' index.html
          grep -q 'familie-portrettfotograf-ringsaker.html' index.html
          grep -q 'bryllupsfotograf-ringsaker.html' portfolio.html
          grep -q 'familie-portrettfotograf-ringsaker.html' portfolio.html
          grep -q 'bryllupsfotograf-ringsaker.html' sitemap.xml
          grep -q 'familie-portrettfotograf-ringsaker.html' sitemap.xml
          grep -q 'samtykke.js' bryllupsfotograf-ringsaker.html
          grep -q 'samtykke.js' familie-portrettfotograf-ringsaker.html

      - name: Lagre nettsideoppdateringen
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git status --porcelain)" ]; then
            echo 'Ingen endringer å lagre.'
            exit 0
          fi
          git config user.name 'FotografSpalder'
          git config user.email 'fotograf.spalder@outlook.com'
          git add index.html portfolio.html sitemap.xml
          git commit -m 'Koble inn permanente sider for bryllup og familie-portrett'
          git push
