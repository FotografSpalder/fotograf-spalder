name: Teknisk kvalitetskontroll

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test sikkerhetsnettet og eksisterende brukerflyt
        run: |
          python scripts/build_site.py --check
          python scripts/check_commercial.py
          python -m unittest discover -s .github/scripts -p 'test_*.py' -v
          node .github/scripts/test_runtime.cjs
      - name: Kontroller nettsiden
        run: |
          python .github/scripts/site_quality.py
          python .github/scripts/site_audit.py --report site-audit.json
          git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-audit
          path: site-audit.json

