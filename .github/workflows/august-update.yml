name: Augustoppdatering av nettsiden

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/august-update.yml'
      - '.github/scripts/august_update.py'
      - '.github/scripts/mobile_layout_fix.py'
      - '.github/scripts/kitten_portfolio_update.py'
      - 'IMG_*.jpg'
  pull_request:
    branches:
      - main
    paths:
      - '.github/scripts/run-august-update.txt'
      - '.github/scripts/inspect-new-images.txt'
      - '.github/scripts/august_update.py'
      - '.github/scripts/mobile_layout_fix.py'
      - '.github/scripts/kitten_portfolio_update.py'
      - 'IMG_*.jpg'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-site:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Hent kildekoden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer bildeverktøy
        run: python -m pip install --upgrade pillow numpy

      - name: Velg og optimaliser bilder
        run: python .github/scripts/august_update.py

      - name: Legg inn kattunger og fullstendig hero-bilde
        run: python .github/scripts/kitten_portfolio_update.py

      - name: Rett mobilvisningen
        run: python .github/scripts/mobile_layout_fix.py

      - name: Normaliser oppdaterte tekstfiler
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path('index.html'),
              Path('portfolio.html'),
              Path('sommerfotografering.html'),
              Path('kjaeledyrsfotograf-ringsaker.html'),
              Path('sitemap.xml'),
          ]
          for path in paths:
              text = path.read_text(encoding='utf-8')
              text = '\n'.join(line.rstrip() for line in text.splitlines()) + '\n'
              path.write_text(text, encoding='utf-8')
          PY

      - name: Kontroller endringer
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import re

          required = [
              Path('index.html'),
              Path('portfolio.html'),
              Path('sommerfotografering.html'),
              Path('kjaeledyrsfotograf-ringsaker.html'),
              Path('sitemap.xml'),
          ]
          for path in required:
              if not path.exists() or path.stat().st_size == 0:
                  raise SystemExit(f'Mangler eller tom fil: {path}')

          for html_path in required[:-1]:
              text = html_path.read_text(encoding='utf-8')
              for ref in re.findall(r'(?:src|srcset)="([^"]+)"', text):
                  ref = ref.split()[0]
                  if ref.startswith(('http://', 'https://', 'data:')):
                      continue
                  if not Path(ref).exists():
                      raise SystemExit(f'{html_path}: bildefilen finnes ikke: {ref}')

          portfolio = Path('portfolio.html').read_text(encoding='utf-8')
          if 'id="natur"' not in portfolio or "showTab(event, 'natur')" not in portfolio:
              raise SystemExit('Natur- og dyrelivskategorien mangler i porteføljen')
          if '<!-- KITTEN_GALLERY_START -->' not in portfolio:
              raise SystemExit('Kattungebildene mangler i kjæledyrporteføljen')
          if portfolio.count('kitten-item') < 7:
              raise SystemExit('Færre enn sju kattungebilder er lagt inn')

          index = Path('index.html').read_text(encoding='utf-8')
          summer = Path('sommerfotografering.html').read_text(encoding='utf-8')

          checks = {
              'mobilmeny på forsiden': '@media (max-width: 950px)' in index and 'position: static;' in index,
              'sensommerpanel innenfor rammen': '.season-card > *' in index and 'overflow: hidden;' in index,
              'kontaktlogo i normal dokumentflyt': '.contact-logo' in index and 'position: static;' in index,
              'mobilmeny på sensommersiden': '@media (max-width: 900px)' in summer and 'position: static;' in summer,
              'kortere praktisk-overskrift': 'Praktisk før fotograferingen' in summer,
              'sikker linjebryting': 'overflow-wrap: anywhere;' in index and 'overflow-wrap: anywhere;' in summer,
              'fullstendig sensommerbilde': 'natur-og-dyreliv-ringsaker-01.webp' in summer and '<picture>' in summer,
              'alternativtekst for hero-bildet': 'alt="Båtliv og landskap ved Mjøsa fotografert i full komposisjon av Fotograf Spalder"' in summer,
              'ingen croppet delingsfil i hero-overstyringen': "url('images/deling/sensommerfotografering-ringsaker.jpg')" not in summer.split('/* FULL_HERO_IMAGE_START */')[-1],
          }
          failed = [name for name, passed in checks.items() if not passed]
          if failed:
              raise SystemExit('Kontroll feilet: ' + ', '.join(failed))

          sitemap = Path('sitemap.xml').read_text(encoding='utf-8')
          if 'portefolje.html' in sitemap or 'portfolio.html' not in sitemap or 'om.html' not in sitemap:
              raise SystemExit('Sitemap er ikke korrekt oppdatert')
          PY

      - name: Lagre nettsideoppdateringen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html portfolio.html sommerfotografering.html kjaeledyrsfotograf-ringsaker.html sitemap.xml images/
          if git diff --cached --quiet; then
            echo "Ingen nye endringer å lagre."
            exit 0
          fi
          git commit -m "Vis hele sensommerbildet og legg inn kattunger"
          git push
